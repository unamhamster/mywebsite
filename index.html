<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운암고 봉사활동 프로젝트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f2f4ef;
  --card: #fbfcf9;
  --ink: #1e2b25;
  --muted: #5f6f66;
  --line: #d3dcd4;
  --plate: #e2e9e1;
  --accent: #1f6b62;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.7 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  word-break: keep-all;
}
button, input { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

/* 머리말 */
.masthead { padding-top: clamp(56px, 9vw, 104px); padding-bottom: 36px; }
.masthead h1 { margin: 0 0 14px; font: 700 clamp(2.1rem, 4.8vw, 3.4rem)/1.2 "Noto Serif KR", serif; letter-spacing: -0.01em; text-wrap: balance; }
.masthead p { margin: 0; max-width: 36em; color: var(--muted); }

/* 필터 막대 */
.toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-block: 1px solid var(--line); }
.toolbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 15px; font-size: .92rem; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tools { display: flex; align-items: center; gap: 14px; }
.search input { width: min(260px, 62vw); padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); outline: none; }
.search input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.count { font-size: .9rem; color: var(--muted); white-space: nowrap; }

/* 표본 카드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 28px; padding-block: 40px 88px; }
.specimen { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 10px 10px 4px; cursor: pointer; outline: none; transition: border-color .2s, box-shadow .2s; }
.specimen:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.specimen:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.plate { position: relative; aspect-ratio: 4 / 3; background: var(--plate); border-radius: 2px; overflow: hidden; }
.plate img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.plate.is-missing img { display: none; }
.stand-in { position: absolute; inset: 0; display: grid; place-items: center; font: 600 3.2rem/1 "Noto Serif KR", serif; color: color-mix(in srgb, var(--accent) 38%, transparent); }
.specimen img { opacity: 0; transition: opacity .5s ease; }
.specimen img.loaded { opacity: 1; }
.label { display: grid; gap: 10px; padding: 18px 8px; }
.label h2, .viewer-info h2 { margin: 0; font: 700 1.3rem/1.3 "Noto Serif KR", serif; }
.latin { margin: 0; font: italic 400 .98rem/1.4 Georgia, "Noto Serif KR", serif; color: var(--muted); }
.summary { margin: 0; font-size: .95rem; color: #34443c; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.facts { display: grid; grid-template-columns: 4.2em 1fr; gap: 6px 12px; margin: 4px 0 0; font-size: .88rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.empty { text-align: center; color: var(--muted); padding: 80px 24px; }
.foot { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: .88rem; }

/* 확대 보기 */
.viewer { width: min(1120px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 0; border-radius: 6px; background: var(--card); color: var(--ink); box-shadow: 0 30px 80px rgba(10, 22, 17, .35); }
.viewer::backdrop { background: rgba(12, 22, 17, .7); backdrop-filter: blur(3px); }
.viewer[open] { animation: lift .3s cubic-bezier(.2, .7, .2, 1); }
@keyframes lift { from { opacity: 0; transform: translateY(10px); } }
.viewer-grid { display: grid; grid-template-columns: 1.2fr 1fr; max-height: calc(100dvh - 32px); overflow: auto; }
.viewer .plate { aspect-ratio: auto; min-height: 420px; border-radius: 0; }
.viewer .plate img { object-fit: contain; }
.viewer-info { display: flex; flex-direction: column; gap: 16px; padding: 44px 40px 32px; }
.viewer-info h2 { font-size: 1.8rem; line-height: 1.25; }
.v-text { max-width: 34em; font-size: .98rem; }
.v-text p { margin: 0 0 .9em; }
.v-nav { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 12px; }
.v-nav button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 8px 18px; cursor: pointer; }
.v-nav button:hover { border-color: var(--accent); color: var(--accent); }
#v-count { margin-inline: auto; color: var(--muted); font-size: .9rem; }
.v-close { position: absolute; top: 12px; right: 12px; z-index: 2; border: 0; background: transparent; border-radius: 999px; padding: 8px 14px; color: var(--muted); cursor: pointer; }
.v-close:hover { color: var(--ink); background: var(--plate); }

@media (max-width: 760px) {
  .viewer-grid { grid-template-columns: 1fr; }
  .viewer .plate { min-height: 0; height: min(56vh, 420px); }
  .viewer-info { padding: 24px 22px; }
  .viewer-info h2 { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<header class="masthead wrap">
  <h1 id="site-title"></h1>
  <p id="site-intro"></p>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="분류 선택"></div>
    <div class="tools">
      <label class="search">
        <span class="sr-only">표본 검색</span>
        <input id="search" type="search" placeholder="검색" autocomplete="off">
      </label>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
  </div>
</div>

<main class="wrap grid" id="grid"></main>
<p class="wrap empty" id="empty" hidden>검색 결과가 없습니다.</p>
<footer class="wrap foot" id="site-footer"></footer>

<dialog class="viewer" id="viewer" aria-labelledby="v-name">
  <button class="v-close" id="v-close" type="button">닫기</button>
  <div class="viewer-grid">
    <div class="plate" id="v-plate">
      <span class="stand-in" id="v-stand" aria-hidden="true"></span>
      <img id="v-img" alt="">
    </div>
    <div class="viewer-info">
      <h2 id="v-name"></h2>
      <p class="latin" id="v-latin"></p>
      <div class="v-text" id="v-text"></div>
      <dl class="facts" id="v-facts"></dl>
      <div class="v-nav">
        <button type="button" id="v-prev">이전</button>
        <span id="v-count"></span>
        <button type="button" id="v-next">다음</button>
      </div>
    </div>
  </div>
</dialog>

<script>
const SITE = {
  title: "운암고 봉사활동 프로젝트",
  intro: "학교 안의 생물들을 생명공학의 눈으로 관찰하고 기록한 학생들의 탐구 결과입니다.",
  footer: "사진과 설명은 탐구에 참여한 학생들이 직접 작성한 자료입니다."
};

/* image 폴더 안에 있는 한글 파일명과 정확히 일치하도록 경로 수정 완료 */
const SPECIMENS = [
  {
    image: "image/소나무.jpg",
    name: "소나무",
    latin: "Pinus densiflora",
    category: "식물",
    place: "", keywords: "", credit: "",
    description: "탐구 설명을 입력하세요."
  },
  {
    image: "image/꽃사과.jpg",
    name: "꽃사과",
    latin: "",
    category: "식물",
    place: "", keywords: "", credit: "",
    description: "꽃사과는 봄에 예쁜 꽃을 피우고 가을에 작은 열매를 맺는 관상용 나무입니다. 열매는 신맛과 떫은맛이 강해 생으로 먹기보단 주로 술, 잼, 차 등으로 가공해서 먹습니다."
  },
  {
    image: "image/방아깨비.jpg",
    name: "방아깨비",
    latin: "Acrida cinerea",
    category: "곤충",
    place: "", keywords: "", credit: "",
    description: "방아깨비는 개미와 달리 무리를 짓지 않고 혼자 살아며, 건드리면 몸을 방아 찧듯 까딱거리는 특징을 가진 초식성 메뚜기과 곤충입니다."
  },
  {
    image: "image/매미.jpg",
    name: "매미",
    latin: "",
    category: "곤충",
    place: "", keywords: "", credit: "",
    description: "매미는 여름철 우렁찬 울음소리로 유명한 곤충입니다. 수년간 땅속에서 애벌레로 지내다가 성충이 되어 세상 밖으로 나오면, 짝짓기를 위해 몇 주 동안 짧고 강렬하게 살다 생을 마감합니다."
  },
  {
    image: "image/개미.jpg",
    name: "개미",
    latin: "",
    category: "곤충",
    place: "", keywords: "", credit: "",
    description: "개미는 철저한 계급 사회를 이루어 협동하며 생태계 순환에 기여하는 대표적인 사회적 곤충입니다."
  },
  {
    image: "image/거미.jpg",
    name: "거미",
    latin: "",
    category: "곤충 외 무척추동물",
    place: "", keywords: "", credit: "",
    description: "거미는 절지동물문 거미강 거미목에 속하는 무척추동물로, 곤충과 달리 머리가슴과 배의 2개 부위로 몸이 나뉘며 8개의 다리와 8개의 홑눈을 가진 것이 특징입니다. 배 끝에 있는 실짓는기관(출사돌기)에서 단백질 성분의 액체를 분비하여 공기와 접촉 시 튼튼한 거미줄로 변형시킵니다."
  },
  {
    image: "image/공벌레.jpg",
    name: "공벌레",
    latin: "Armadillidium vulgare",
    category: "곤충 외 무척추동물",
    place: "", keywords: "", credit: "",
    description: "공벌레는 곤충이 아닌 갑각류에 속하는 생물로, 위험을 느끼거나 건조할 때 몸을 공처럼 둥글게 마는 특징이 있습니다. 돌 밑이나 낙엽 더미 등 어둡고 습한 곳에 주로 서식하며, 썩은 식물이나 동물의 사체는 물론 토양 속의 중금속까지 먹어 치우고 분해하여 생태계를 정화하는 익충입니다."
  },
  {
    image: "image/지렁이.jpg",
    name: "지렁이",
    latin: "",
    category: "곤충 외 무척추동물",
    place: "", keywords: "", credit: "",
    description: "지렁이는 환형동물문 빈모강에 속하는 대표적인 무척추동물로, 전 세계의 토양 생태계 전반에 널리 분포하고 있습니다. 몸이 수많은 마디(체절)로 이루어져 있으며, 빛을 싫어하는 등배성 생태 특성에 따라 대부분의 일생을 땅 속에서 보냅니다."
  },
  {
    image: "image/참새.jpg",
    name: "참새",
    latin: "Passer montanus",
    category: "조류",
    place: "", keywords: "", credit: "",
    description: "참새는 조강 참새목 참새과에 속하는 소형 조류로, 주로 인간의 거주지 근처에서 무리를 지어 살며 곡물이나 곤충을 먹고 사는 대표적인 텃새입니다."
  },
  {
    image: "image/제비.jpg",
    name: "제비",
    latin: "Hirundo rustica",
    category: "조류",
    place: "", keywords: "", credit: "",
    description: "탐구 설명을 입력하세요."
  },
  {
    image: "image/비둘기.jpg",
    name: "비둘기",
    latin: "Columba livia",
    category: "조류",
    place: "", keywords: "", credit: "",
    description: "비둘기는 조강 비둘기목 비둘기과에 속하는 조류로, 지구 자기장과 태양을 활용해 뛰어난 길찾기(귀소 본능) 능력을 발휘하며, 어미가 소화액과 영양분이 섞인 '비둘기 젖(크롭 밀크)'을 분비해 새끼를 키우는 독특한 생물학적 특징을 가지고 있습니다."
  },
  {
    image: "image/사람.jpg",
    name: "사람",
    latin: "Homo sapiens",
    category: "포유류",
    place: "", keywords: "", credit: "",
    description: "사람은 두 발로 걷고 고도의 지능을 가진 영장류입니다. 복잡한 언어와 도구를 사용하며, 고유한 문화와 문명을 이루고 살아가는 지구상에서 가장 발달한 생명체입니다."
  }
];

const $ = id => document.getElementById(id);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const CATEGORIES = ["전체", ...new Set(SPECIMENS.map(s => s.category))];

let filter = "전체", query = "", visible = [], current = 0, returnFocus = null;

const factsHTML = s => [["분류", s.category], ["장소", s.place], ["키워드", s.keywords], ["기록", s.credit]]
  .filter(([, v]) => v)
  .map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`)
  .join("");

const cardHTML = (s, i) => `
  <article class="specimen" tabindex="0" role="button" data-i="${i}" aria-label="${esc(s.name)} 자세히 보기">
    <div class="plate">
      <span class="stand-in" aria-hidden="true">${esc(s.name.charAt(0))}</span>
      <img src="${esc(s.image)}" alt="${esc(s.name)}" loading="lazy" decoding="async"
            onload="this.classList.add('loaded')" onerror="this.parentElement.classList.add('is-missing')">
    </div>
    <div class="label">
      <h2>${esc(s.name)}</h2>
      ${s.latin ? `<p class="latin">${esc(s.latin)}</p>` : ""}
      <p class="summary">${esc(s.description.replace(/\s+/g, " "))}</p>
      <dl class="facts">${factsHTML(s)}</dl>
    </div>
  </article>`;

function render() {
  const q = query.trim().toLowerCase();
  visible = SPECIMENS.filter(s => {
    const inCategory = filter === "전체" || s.category === filter;
    const text = [s.name, s.latin, s.category, s.place, s.keywords, s.description].join(" ").toLowerCase();
    return inCategory && text.includes(q);
  });
  $("grid").innerHTML = visible.map((s, i) => cardHTML(s, i)).join("");
  $("count").textContent = `${visible.length}개 표본`;
  $("empty").hidden = visible.length > 0;
}

function fillViewer() {
  const s = visible[current];
  $("v-plate").classList.remove("is-missing");
  $("v-img").src = s.image;
  $("v-img").alt = s.name;
  $("v-stand").textContent = s.name.charAt(0);
  $("v-name").textContent = s.name;
  $("v-latin").textContent = s.latin || "";
  $("v-latin").hidden = !s.latin;
  $("v-text").innerHTML = s.description.split(/\n\s*\n/).map(p => `<p>${esc(p)}</p>`).join("");
  $("v-facts").innerHTML = factsHTML(s);
  $("v-count").textContent = `${current + 1} / ${visible.length}`;
}

function openViewer(i) {
  returnFocus = document.activeElement;
  current = i;
  fillViewer();
  $("viewer").showModal();
}

function step(d) {
  current = (current + d + visible.length) % visible.length;
  fillViewer();
}

/* 초기화 */
document.title = SITE.title;
$("site-title").textContent = SITE.title;
$("site-intro").textContent = SITE.intro;
$("site-footer").textContent = SITE.footer;

$("chips").innerHTML = CATEGORIES.map(c =>
  `<button class="chip" type="button" data-cat="${esc(c)}" aria-pressed="${c === filter}">${esc(c)}</button>`).join("");
$("chips").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  filter = chip.dataset.cat;
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b === chip)));
  render();
});

$("search").addEventListener("input", e => { query = e.target.value; render(); });

$("grid").addEventListener("click", e => {
  const card = e.target.closest(".specimen");
  if (card) openViewer(Number(card.dataset.i));
});
$("grid").addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("specimen")) {
    e.preventDefault();
    openViewer(Number(e.target.dataset.i));
  }
});

const viewer = $("viewer");
$("v-prev").onclick = () => step(-1);
$("v-next").onclick = () => step(1);
$("v-close").onclick = () => viewer.close();
$("v-img").onerror = () => $("v-plate").classList.add("is-missing");
viewer.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});
viewer.addEventListener("click", e => { if (e.target === viewer) viewer.close(); });
viewer.addEventListener("close", () => { if (returnFocus?.isConnected) returnFocus.focus(); });

render();
</script>
</body>
</html>
